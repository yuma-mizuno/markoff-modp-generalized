fidelity:
  divergences: >-
    The advertised endpoint is a fixed-integral, explicit-cutoff reformulation
    of the generic branch of Kingsbury-Neuschotz, Theorem 4.3, rather than an
    original qualitative eventual theorem. The source proves a coefficient-
    uniform finite-field transitivity statement under modular nondegeneracy;
    the submission fixes an integrally nondegenerate triple, makes a sufficient
    cutoff fully explicit, and derives full-surface reduction surjectivity from
    punctured Vieta transitivity using the integral base point (1,1,1) and the
    fixed origin. It additionally proves transitivity for the two-Vieta
    rotation subgroup. The individual Vieta and rotation groups remain
    distinct, and coordinate permutations are used only together with the
    corresponding coefficient permutations. From arXiv:2509.02187v3, the
    submission proves only the generic branch of Theorem 1.1 needed by the
    endpoint; the exceptional-compatible branch is not proved. Its
    zero-coordinate argument is replaced by a direct totalized raw-angle
    defect and finite-cycle summation. Further literature and upstream
    formalization provenance for the vendored dependency is recorded in the
    related markoff-modp project.

review:
  status: "self-assessed"
  reviewers:
    - "Yuma Mizuno"
  notes: >-
    The main result has no production sorry declarations. Its axiom
    dependencies are audited, and Comparator checks the public statement and
    permitted axioms in CI. Source relationships and proof-status boundaries
    were reviewed against the cited public versions. No independent peer
    review is claimed.

alignment:
  namespace: "Challenge"
  statements:
    - source: "Kingsbury-Neuschotz, arXiv:2603.04096v3, Theorem 4.3, generic branch"
      lean: "Challenge.generalizedMarkoff_reduction_surjective_of_large_prime"
      module: "Solution"
      status: "adapted"
      note: >-
        The source gives punctured Vieta transitivity uniformly in the
        parameters under modular nondegeneracy. The Challenge fixes an
        integrally nondegenerate ordered triple, existentially quantifies the
        cutoff, and states the short consequence that coordinatewise reduction
        from integral solutions is surjective. Solution supplies the explicit
        coefficient-dependent cutoff proved by the production development.

    - source: "de Courcy-Ireland--Litman--Mizuno, arXiv:2509.02187v3, Theorem 1.1, generic branch"
      lean: "GenMarkoff.generalizedMartinGenericDivisibility"
      module: "GenMarkoff.Divisibility.GenericMartin"
      status: "proved"
      note: >-
        Proves p-divisibility for every punctured Vieta orbit when the
        multiplier and all coefficient discriminants are nonzero. The
        exceptional-compatible branch of the source theorem is not claimed by
        this declaration.

    - source: "Kingsbury-Neuschotz, arXiv:2603.04096v3, Theorem 4.3 and Sections 5--9"
      lean: "GenMarkoff.General.Assembly.IntegrallyNondegenerate.vietaStrongApproximationAt_of_explicitCutoff"
      module: "GenMarkoff.General.Assembly.ExplicitStrongApproximation"
      status: "adapted"
      note: >-
        Formalizes the generic Vieta-transitivity conclusion for fixed ordered
        coefficients, follows the source's opening, middle-game, endgame, and
        cage architecture, combines it with the formalized generic divisibility
        input, and replaces the implicit sufficiently-large condition by a
        displayed sufficient cutoff.

acknowledgements: >-
  Built on Lean 4, mathlib, leanprover/comparator, and the related markoff-modp
  formalization. The two direct mathematical sources and their authors are
  credited above; further dependency provenance is recorded by that related
  project.
