version: "v0.4"

project:
  name: "Generalized Markoff strong approximation"
  description: >-
    A Lean 4 formalization of generalized Markoff surfaces with a fixed
    ordered integral coefficient triple. It proves punctured full-Vieta and
    rotation strong approximation for every sufficiently large prime, with
    an explicit coefficient-dependent cutoff, and derives surjectivity of
    reduction from integral solutions onto the full finite-field surface.
  authors:
    - "Yuma Mizuno"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Yuma Mizuno"

classification:
  arxiv:
    - "math.NT"
  msc2020:
    - "11D25"
    - "11T06"

sources:
  - title: "Generalized Markov mod-p graphs"
    authors:
      - "Yuma Mizuno"
    id: "https://github.com/yuma-mizuno/GenMarkoff/blob/df95fae89016f56a5f160a7423ce47ba450005a4/Paper/Modp/markov_modp.pdf"
    type: "paper"
    location: "https://github.com/yuma-mizuno/GenMarkoff/blob/df95fae89016f56a5f160a7423ce47ba450005a4/Paper/Modp/markov_modp.pdf"
    relationship: "adapts"
    note: >-
      The formalization proves a corrected fixed-integral eventual theorem:
      it punctures only the fixed origin, separates the Vieta and rotation
      groups, and uses an explicit coefficient-dependent cutoff.
    author_endorsement: "participated"

  - title: "Strong Approximation for the Relative Character Variety of the Four-Times Punctured Sphere"
    authors:
      - "Nathaniel Kingsbury-Neuschotz"
    id: "arXiv:2603.04096v2"
    type: "paper"
    location: "https://arxiv.org/abs/2603.04096v2"
    relationship: "adapts"
    note: >-
      The general connecting-fibre and cage route is adapted to the fixed
      ordered generalized Markoff family.

  - title: "Strong Approximation and Diophantine Properties of Markoff Triples"
    authors:
      - "Jean Bourgain"
      - "Alexander Gamburd"
      - "Peter Sarnak"
    id: "https://doi.org/10.1090/jams/1061"
    type: "paper"
    location: "https://doi.org/10.1090/jams/1061"
    relationship: "background"
    note: >-
      Provides the classical strong-approximation strategy generalized by the
      formal development.

related_formalizations:
  - id: "https://github.com/yuma-mizuno/markoff-modp/tree/ac8e9ec37a3d56dddb55870d379f53e5526dc0c7"
    relationship: "builds-on"
    note: >-
      The transitive BGS and Riemann-Roch proof dependencies from this exact
      revision are vendored in the submission. Unrelated production modules
      and the Blueprint and Comparator layers are omitted; retained modules
      supply the reusable classical Markoff, Hasse-Weil, Kummer, and growth
      results.
  - id: "https://github.com/yuma-mizuno/BGS/tree/43467694971e7f80d85244c1711c457ff1ac7999"
    relationship: "adapts"
    note: >-
      Reference formalization used to identify the classical theorem
      boundaries before adapting them to fixed generalized coefficients.

status:
  scope: >-
    For every ordered integral coefficient triple a with
    3 + a_1 + a_2 + a_3 nonzero and a_i^2 different from 4 for all i, the
    development proves full-Vieta and rotation transitivity on the
    finite-field surface with only the origin removed at every sufficiently
    large prime. It gives an explicit maximum of one uniform analytic
    constant and coefficient-dependent bad-reduction bounds, then proves
    surjectivity of coordinatewise reduction from all integral solutions onto
    the full finite-field surface. It does not prove the proposed
    all-generic-primes statement, a coefficient-uniform cutoff, or a direct
    pre-transitivity parity-cage construction.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Quot.sound"
    - "Classical.choice"

automation:
  methods:
    - method: "agent"
      models:
        - "OpenAI Codex models"
      framework: "OpenAI Codex"
      tool_setup: >-
        AI-assisted Lean theorem proving, proof repair, repository refactoring,
        source comparison, builds, and axiom audits, with mathematical
        direction and acceptance decisions by Yuma Mizuno.
      cost:
        wall_time: "not reconstructed"
        spend_usd: "not tracked"
        hardware: "local Windows workstation and GitHub Actions"
      prompting_notes: >-
        Iterative prompts requested complete in-repository proofs, exact
        source-to-Lean boundaries, full builds, and explicit axiom audits.
  spend_usd: "not tracked"
  notes: >-
    Development combined manual mathematical design with agent-assisted Lean
    implementation and repeated kernel, build, source-fidelity, and metadata
    checks.

fidelity:
  divergences: >-
    The source's all-solution graph is replaced by the mathematically necessary
    punctured graph, where punctured means removing only (0,0,0). The
    individual Vieta group and the two-factor rotation group remain distinct.
    Rotations are defined by their two Vieta factors rather than by the
    incorrect square of one affine map when adjacent coefficients differ.
    Coordinate permutations are used only together with coefficient
    permutations. The printed parabolic fibre count is not used without its
    missing sign condition. The divisibility source's zero-coordinate formula
    is replaced by a proved corrected identity. The advertised theorem is a
    fixed-integral eventual statement with an explicit coefficient-dependent
    cutoff, not the stronger proposed all-generic-primes or coefficient-uniform
    statement.

review:
  status: "self-assessed"
  reviewers:
    - "Yuma Mizuno"
  notes: >-
    The author reviewed the statement against the source corrections and the
    production endpoint. Production sources were checked for proof
    placeholders and custom axioms; public endpoints are covered by
    declaration-level axiom guards. Comparator independently matches the
    Mathlib-only Challenge statement to the proved Solution declaration.

alignment:
  namespace: "Challenge"
  statements:
    - source: "Generalized Markov mod-p graphs, proposed generalized connectivity problem"
      lean: "Challenge.generalizedMarkoff_reduction_surjective_of_large_prime"
      module: "Solution"
      status: "adapted"
      note: >-
        The elementary Challenge statement existentially quantifies the
        cutoff. Solution defines the explicit coefficient-dependent cutoff
        and supplies it as the witness. The result does not assert all generic
        primes or a coefficient-uniform threshold.
    - source: "Strong Approximation and Diophantine Properties of Markoff Triples, classical strategy"
      lean: "GenMarkoff.General.Assembly.IntegrallyNondegenerate.vietaStrongApproximationAt_of_explicitCutoff"
      module: "GenMarkoff.General.Assembly.ExplicitStrongApproximation"
      status: "adapted"
      note: >-
        Extends the classical strategy to fixed ordered generalized
        coefficients; the all-zero case is connected to the pinned classical
        formalization at an explicit theorem boundary.

acknowledgements: >-
  Built on Lean, Mathlib, the pinned markoff-modp/BGS formalization, and the
  PalomarTemplate verification infrastructure. The mathematical sources and
  their authors are credited above.
