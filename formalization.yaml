# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml (v0.4): repo-root metadata for the GenMarkoff formalization.
version: "v0.4"

project:
  name: "Generalized Markoff strong approximation"
  description: >-
    A Lean 4 formalization of the generic branch of eventual strong
    approximation for generalized Markoff surfaces, specialized to a fixed
    ordered integral coefficient triple. It proves punctured transitivity for
    both the full Vieta group and the two-Vieta rotation group, supplies an
    explicit coefficient-dependent cutoff, and derives surjectivity of
    coordinatewise reduction onto the full finite-field surface.
  authors:
    - "Yuma Mizuno"
  responsible_maintainers:
    - "Yuma Mizuno"
  license: "Apache-2.0"

repository:
  role: "substantive-development"

classification:
  arxiv:
    - "math.NT"
    - "math.DS"
  msc2020:
    - "11D25"
    - "11T06"
    - "37P25"

sources:
  - title: "Strong Approximation for the Relative Character Variety of the Four-Times Punctured Sphere"
    authors:
      - "Nathaniel Kingsbury-Neuschotz"
    id: "arXiv:2603.04096v3"
    type: "preprint"
    location: "Theorem 4.3, generic branch, with Sections 5--9"
    relationship: "adapts"
    author_endorsement: "not-contacted"
    note: >-
      Primary source for the qualitative eventual Vieta-transitivity result.
      Theorem 4.3 is uniform in the coefficient parameters once its modular
      nondegeneracy hypotheses hold. The submitted Challenge fixes an
      integrally nondegenerate coefficient triple and packages that result as
      eventual surjectivity of coordinatewise reduction: a Vieta word applied
      to the integral solution (1,1,1) lifts every nonzero residue-class
      solution, and the origin lifts itself. The Lean development additionally
      gives a fully explicit coefficient-dependent cutoff and proves
      transitivity for the two-Vieta rotation subgroup. Those are refinements;
      the qualitative eventual reduction-surjectivity theorem is not claimed
      as original.

  - title: "Divisibility by p for Markoff-like Surfaces"
    authors:
      - "Matthew de Courcy-Ireland"
      - "Matthew Litman"
      - "Yuma Mizuno"
    id: "arXiv:2509.02187v3"
    type: "article"
    location: "Theorem 1.1, generic branch, and Section 2"
    relationship: "adapts"
    license: "CC BY 4.0"
    author_endorsement: "participated"
    note: >-
      Direct source for divisibility of punctured Vieta-orbit cardinalities by
      p when the multiplier and all three coefficient discriminants are
      nonzero. The submission proves this generic branch. At zero-coordinate
      points it replaces the paper's pointwise propagation construction with
      a totalized raw-angle defect identity and an invariant finite-cycle sum.
      The paper's additional exceptional-compatible branch is recorded as a
      specification but is not proved in this submission.

related_formalizations:
  - id: "https://github.com/yuma-mizuno/markoff-modp"
    relationship: "builds-on"
    note: >-
      Related formalization from which the submission vendors the transitive
      proof dependencies at revision
      ac8e9ec37a3d56dddb55870d379f53e5526dc0c7. It records the additional
      mathematical literature and upstream formalization dependencies used by
      those modules. Submission-facing provenance comments cite public sources
      with stable bibliographic locators.

status:
  scope: >-
    For every ordered integral coefficient triple a with
    3 + a_1 + a_2 + a_3 nonzero and a_i^2 different from 4 for all i, the
    development proves full-Vieta and two-Vieta-rotation transitivity on the
    finite-field surface with only the origin removed at every sufficiently
    large prime. It gives an explicit maximum of one uniform analytic
    constant and coefficient-dependent bad-reduction bounds, then proves
    surjectivity of coordinatewise reduction from all integral solutions onto
    the full finite-field surface. The result is eventual for each fixed
    triple; it is not a coefficient-uniform or all-generic-primes theorem.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Quot.sound"
    - "Classical.choice"
  main_results:
    - declaration: "Challenge.generalizedMarkoff_reduction_surjective_of_large_prime"
      sorry_count: 0
      axioms:
        - "propext"
        - "Quot.sound"
        - "Classical.choice"
      literature_dependencies: []
    - declaration: "GenMarkoff.General.Assembly.IntegrallyNondegenerate.reduction_surjective_of_concreteExplicitCutoff"
      sorry_count: 0
      axioms:
        - "propext"
        - "Quot.sound"
        - "Classical.choice"
      literature_dependencies: []

